<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="随口译">
<meta name="theme-color" content="#f3f5f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d121b" media="(prefers-color-scheme: dark)">
<title>随口译</title>
<style>
/* Layout: one-screen app — header, segment stream, control bar, tab bar. */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --ink:#141b2b; --muted:#5f6a80; --line:#dfe4ee;
  --accent:#2556d8; --accent-ink:#ffffff; --accent-soft:#e6edfc; --tr:#1f4cc4;
  --live:#d6403a; --ok:#1e9a57; --warn-bg:#fff3d9; --warn-ink:#6a4900;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sub:20px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d121b; --surface:#161d2a; --ink:#e8ecf4; --muted:#909bb0; --line:#273044;
  --accent:#5f8bff; --accent-ink:#0a1430; --accent-soft:#1b2846; --tr:#8eadff;
  --live:#f06a62; --ok:#43c47f; --warn-bg:#3a2f12; --warn-ink:#f3d58f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d121b; --surface:#161d2a; --ink:#e8ecf4; --muted:#909bb0; --line:#273044;
  --accent:#5f8bff; --accent-ink:#0a1430; --accent-soft:#1b2846; --tr:#8eadff;
  --live:#f06a62; --ok:#43c47f; --warn-bg:#3a2f12; --warn-ink:#f3d58f; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-text-size-adjust:100%;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top{display:flex;align-items:center;gap:10px;padding-block:10px;background:var(--surface);border-bottom:1px solid var(--line)}
.top h1{font-size:17px;margin:0;font-weight:650}
.pair{margin-left:auto;display:flex;align-items:center;gap:4px}
.pair select{appearance:none;-webkit-appearance:none;border:0;background:var(--accent-soft);color:var(--accent);font-weight:600;border-radius:999px;padding:5px 12px;font-size:14px;max-width:100px;text-align:center}
.swap{border:0;background:none;padding:4px 6px;font-size:16px;color:var(--muted)}
.banner{background:var(--warn-bg);color:var(--warn-ink);font-size:13px;padding-block:8px}

/* segment stream */
.stream{flex:1;min-height:0;overflow-y:auto;padding-block:12px 20px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.seg{background:var(--surface);border-radius:14px;padding:10px 14px 12px;display:flex;flex-direction:column;gap:4px;min-width:0;border:1px solid var(--line)}
.meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.meta time{font-family:var(--mono);font-variant-numeric:tabular-nums;margin-left:auto}
.state::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:5px;vertical-align:1px}
.state.busy::before{background:var(--accent)}
.state.listen::before{background:var(--live);animation:blink 1s steps(2) infinite}
.state.fail::before{background:var(--live)}
@keyframes blink{50%{opacity:.25}}
.orig{color:var(--muted);font-size:calc(var(--sub) * .75);line-height:1.45;overflow-wrap:anywhere}
.tr{color:var(--tr);font-size:var(--sub);font-weight:650;line-height:1.45;overflow-wrap:anywhere}
.tr.wait{color:var(--muted);font-weight:400}
.tr.err{color:var(--live);font-weight:400;font-size:14px}
.seg.live{border-style:dashed}
.seg.live .tr{opacity:.7}
.hide-orig .seg:not(.live) .orig{display:none}
.empty{margin:auto;text-align:center;color:var(--muted);max-width:30ch;display:flex;flex-direction:column;gap:6px}
.empty b{color:var(--ink);font-size:16px}
.jump{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.12)}

/* controls */
.controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding-block:10px 6px;background:var(--surface);border-top:1px solid var(--line)}
.controls > :first-child{justify-self:start}
.controls > :last-child{justify-self:end}
.ghost{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 14px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.ghost svg{width:16px;height:16px}
.mic{width:64px;height:64px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 3px 12px rgba(37,86,216,.3)}
.mic svg{width:26px;height:26px}
.mic.stop{background:var(--live);color:#fff;box-shadow:0 3px 12px rgba(214,64,58,.3)}
.mic.stop svg{width:22px;height:22px}
.clock{font:600 15px var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);display:flex;align-items:center;gap:6px}
.clock::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--live);animation:blink 1s steps(2) infinite}
.clock.paused::before{animation:none;background:var(--muted)}
@media (prefers-reduced-motion: reduce){.state.listen::before,.clock::before{animation:none}}
.status{font-size:12px;color:var(--muted);text-align:center;min-height:20px;padding-bottom:4px;background:var(--surface);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{border:0;background:none;padding:8px 0 9px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-selected="true"]{color:var(--accent);font-weight:600}

/* dialog */
.duo{flex:1;min-height:0;display:grid;grid-template-rows:1fr auto 1fr}
.half{min-height:0;display:flex;flex-direction:column;background:var(--surface)}
.half.them{transform:rotate(180deg);background:var(--bg)}
.half .stream{gap:8px;padding-block:12px}
.bubble{max-width:86%;padding:8px 12px;border-radius:16px;font-size:calc(var(--sub) * .9);line-height:1.4;overflow-wrap:anywhere}
.bubble.mine{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.bubble.other{align-self:flex-start;background:var(--accent-soft);color:var(--ink);border-bottom-left-radius:4px}
.bubble small{display:block;opacity:.72;font-size:12px;margin-top:2px}
.talk{display:flex;align-items:center;gap:12px;padding-block:10px;border-top:1px solid var(--line)}
.talk .label{flex:1;min-width:0;font-size:14px;color:var(--muted)}
.talk .label b{display:block;color:var(--ink);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.talk .mic{width:56px;height:56px}
.talk .mic.on{background:var(--live);color:#fff}
.divider{display:flex;align-items:center;justify-content:center;gap:8px;padding-block:6px;background:var(--bg);border-block:1px solid var(--line);font-size:13px;color:var(--muted);flex-wrap:wrap}
.divider select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 8px;font-size:13px}

/* history + settings */
.scroll{flex:1;min-height:0;overflow-y:auto;padding-block:14px 28px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.card h2{font-size:15px;margin:0}
.card p{margin:0;color:var(--muted);font-size:13px}
.hitem{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;width:100%}
.hitem .t{flex:1;min-width:0}
.hitem .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hitem .t span{font-size:12px;color:var(--muted)}
.chip{font-size:11px;border-radius:999px;padding:2px 8px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-size:15px;color:var(--ink);width:100%}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:8px 14px;font-size:14px;font-weight:600}
.btn.sec{background:var(--bg);color:var(--ink);border:1px solid var(--line);font-weight:400}
.btn.danger{background:none;color:var(--live);border:1px solid var(--line);font-weight:400}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px}
.toggle input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.toggle span small{display:block;color:var(--muted);font-size:12px}
.summary{white-space:pre-wrap;font-size:14px;line-height:1.65}
.note{font-size:12px;color:var(--muted)}
.diag{font:12px/1.6 var(--mono);color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:14px;z-index:9;max-width:calc(100% - 32px);text-align:center}
</style>
</head>
<body>
<div class="app">

  <!-- 同传 -->
  <section class="view" id="v-live">
    <header class="top pad">
      <h1>同传</h1>
      <div class="pair">
        <select id="live-from" aria-label="听的语言"></select>
        <button class="swap" id="live-swap" aria-label="交换语言">⇄</button>
        <select id="live-to" aria-label="翻译成"></select>
      </div>
    </header>
    <div class="banner pad" id="banner" hidden></div>
    <div style="position:relative;flex:1;min-height:0;display:flex;flex-direction:column">
      <div class="stream pad" id="live-stream"></div>
      <button class="jump" id="live-jump" hidden>回到最新 ↓</button>
    </div>
    <div class="controls pad">
      <div id="ctl-left">
        <button class="ghost" id="live-new">新会话</button>
        <button class="ghost" id="live-pause" hidden>暂停</button>
      </div>
      <button class="mic" id="live-mic" aria-label="开始同传">
        <svg id="ico-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        <svg id="ico-stop" viewBox="0 0 24 24" hidden><rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor"/></svg>
      </button>
      <div id="ctl-right">
        <button class="ghost" id="live-copy">复制</button>
        <span class="clock" id="live-clock" hidden>00:00</span>
      </div>
    </div>
    <div class="status pad" id="live-status">点麦克风开始，适合听课、讲座、视频</div>
  </section>

  <!-- 对话 -->
  <section class="view" id="v-duo" hidden>
    <div class="duo">
      <div class="half them">
        <div class="stream pad" id="duo-them"></div>
        <div class="talk pad">
          <div class="label"><b id="them-label">English</b><span id="them-hint">Tap and speak</span></div>
          <button class="mic" id="them-mic" aria-label="对方说话"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        </div>
      </div>
      <div class="divider pad">
        <span>我</span><select id="duo-me" aria-label="我的语言"></select>
        <span>对方</span><select id="duo-other" aria-label="对方语言"></select>
        <button class="swap" id="duo-clear">清空</button>
      </div>
      <div class="half me">
        <div class="stream pad" id="duo-me-stream"></div>
        <div class="talk pad">
          <div class="label"><b id="me-label">中文</b><span>按一下说话，说完自动翻译</span></div>
          <button class="mic" id="me-mic" aria-label="我说话"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        </div>
      </div>
    </div>
  </section>

  <!-- 记录 -->
  <section class="view" id="v-hist" hidden>
    <header class="top pad"><h1 id="hist-title">记录</h1>
      <div class="pair"><button class="btn sec" id="hist-back" hidden>返回</button></div>
    </header>
    <div class="scroll pad" id="hist-body"></div>
  </section>

  <!-- 设置 -->
  <section class="view" id="v-set" hidden>
    <header class="top pad"><h1>设置</h1></header>
    <div class="scroll pad">
      <div class="card">
        <h2>翻译引擎</h2>
        <label class="field">引擎
          <select id="s-engine">
            <option value="auto">自动（先用微软免费翻译，失败再换）</option>
            <option value="microsoft">微软翻译（免费，速度快）</option>
            <option value="mymemory">MyMemory（免费，较慢，每天有额度）</option>
            <option value="llm">大模型 API（最准，逐字出译文，需要 Key）</option>
          </select>
        </label>
        <div id="llm-box" class="row" style="flex-direction:column;align-items:stretch;gap:10px">
          <div class="row">
            <span class="note">快速填入：</span>
            <button class="btn sec" data-preset="deepseek">DeepSeek</button>
            <button class="btn sec" data-preset="qwen">通义千问</button>
            <button class="btn sec" data-preset="openai">OpenAI</button>
          </div>
          <label class="field">接口地址（OpenAI 兼容）<input id="s-base" placeholder="https://api.deepseek.com" autocomplete="off"></label>
          <label class="field">模型名<input id="s-model" placeholder="deepseek-chat" autocomplete="off"></label>
          <label class="field">API Key<input id="s-key" type="password" placeholder="sk-..." autocomplete="off"></label>
          <p class="note">Key 只保存在这台手机的浏览器里。有的服务商不允许网页直接调用，测试会报网络错误，换一家即可。</p>
        </div>
        <div class="row"><button class="btn" id="s-test">测试翻译</button><span class="note" id="s-test-out"></span></div>
      </div>
      <div class="card">
        <h2>同传</h2>
        <label class="toggle"><span>边说边译<small>说话时先出预览译文，停顿后再出正式译文</small></span><input type="checkbox" id="s-preview" checked></label>
        <label class="field">断句速度
          <select id="s-pause">
            <option value="600">快（停顿 0.6 秒就断句，适合语速慢）</option>
            <option value="900">标准</option>
            <option value="1300">慢（适合讲课、长句）</option>
          </select>
        </label>
        <label class="toggle">显示原文 <input type="checkbox" id="s-orig" checked></label>
        <label class="toggle">屏幕常亮 <input type="checkbox" id="s-wake" checked></label>
        <label class="field">字幕大小 <input type="range" id="s-size" min="16" max="30" step="1" value="20"></label>
      </div>
      <div class="card">
        <h2>对话</h2>
        <label class="toggle">朗读译文 <input type="checkbox" id="s-tts" checked></label>
      </div>
      <div class="card">
        <h2>运行情况</h2>
        <p>出问题时把这里截图发出来，方便排查。</p>
        <div class="diag" id="diag">还没有翻译记录</div>
      </div>
      <div class="card">
        <h2>使用须知</h2>
        <p>iPhone 请用 Safari 打开，并在 设置 → 通用 → 键盘 中打开"启用听写"。电脑请用 Chrome。页面必须是 https 地址才能用麦克风。AI 总结需要先配置大模型 API。</p>
        <p class="note">版本 0.2</p>
      </div>
    </div>
  </section>

  <nav class="tabs" role="tablist">
    <button role="tab" data-view="live" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 11h11M4 16h14M4 21h8"/></svg>同传</button>
    <button role="tab" data-view="duo" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5h11v8H9l-3 3v-3H4zM15 9h5v8h-2v3l-3-3h-4v-2"/></svg>对话</button>
    <button role="tab" data-view="hist" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg>记录</button>
    <button role="tab" data-view="set" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>设置</button>
  </nav>
</div>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';
/* ---------- languages ---------- */
const LANGS = [
  {id:'zh', sr:'zh-CN', mm:'zh-CN', ms:'zh-Hans', bt:'zh', name:'中文', native:'中文', hint:'按一下说话'},
  {id:'en', sr:'en-US', mm:'en-US', ms:'en', bt:'en', name:'英语', native:'English', hint:'Tap and speak'},
  {id:'ja', sr:'ja-JP', mm:'ja-JP', ms:'ja', bt:'ja', name:'日语', native:'日本語', hint:'タップして話してください'},
  {id:'ko', sr:'ko-KR', mm:'ko-KR', ms:'ko', bt:'ko', name:'韩语', native:'한국어', hint:'탭하고 말하세요'},
  {id:'fr', sr:'fr-FR', mm:'fr-FR', ms:'fr', bt:'fr', name:'法语', native:'Français', hint:'Touchez et parlez'},
  {id:'de', sr:'de-DE', mm:'de-DE', ms:'de', bt:'de', name:'德语', native:'Deutsch', hint:'Tippen und sprechen'},
  {id:'es', sr:'es-ES', mm:'es-ES', ms:'es', bt:'es', name:'西班牙语', native:'Español', hint:'Toca y habla'},
  {id:'ru', sr:'ru-RU', mm:'ru-RU', ms:'ru', bt:'ru', name:'俄语', native:'Русский', hint:'Нажмите и говорите'},
  {id:'yue', sr:'zh-HK', mm:'zh-HK', ms:'yue', bt:'zh-Hant', name:'粤语', native:'粵語', hint:'撳一下講嘢'}
];
const L = id => LANGS.find(l => l.id === id) || LANGS[0];
const $ = s => document.querySelector(s);

/* ---------- storage (best effort) ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem('sky.'+k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('sky.'+k, JSON.stringify(v)); }catch(e){} }
};
const settings = Object.assign({
  engine:'auto', base:'', model:'', key:'', showOrig:true, tts:true, wake:true, size:20,
  preview:true, pauseMs:900, liveFrom:'en', liveTo:'zh', duoMe:'zh', duoOther:'en'
}, store.get('settings', {}));
const saveSettings = () => store.set('settings', settings);

/* ---------- utils ---------- */
const toastEl = $('#toast'); let toastT;
function toast(msg){ toastEl.textContent = msg; toastEl.hidden = false; clearTimeout(toastT); toastT = setTimeout(()=>toastEl.hidden = true, 2400); }
const hhmm = t => new Date(t).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
const dateStr = t => new Date(t).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
const mmss = ms => { const s = Math.floor(ms/1000); return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); };
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); toast('已复制'); }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); let ok=false; try{ ok = document.execCommand('copy'); }catch(_){}
    ta.remove(); toast(ok ? '已复制' : '复制失败，请手动选择文字');
  }
}
function downloadTxt(name, text){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type:'text/plain;charset=utf-8'}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

/* ---------- diagnostics ---------- */
const diag = {engine:'—', ms:0, count:0, err:'', rec:''};
function diagRender(){
  const el = $('#diag'); if(!el) return;
  el.textContent = '上次引擎：' + diag.engine + '\n上次用时：' + (diag.ms ? diag.ms + ' ms' : '—') + '\n本次翻译句数：' + diag.count
    + '\n最近翻译错误：' + (diag.err || '无') + '\n最近识别事件：' + (diag.rec || '无')
    + '\n浏览器：' + navigator.userAgent.replace(/^Mozilla\/5\.0 /,'').slice(0,120);
}

/* =========================================================
   Segmenter — turns a growing transcript into sentences.
   Safari keeps one long, growing result; Chrome emits many
   final results. Both are flattened into one string, and the
   segmenter remembers where the last committed sentence ended.
   ========================================================= */
//@@SEGMENTER_START
class Segmenter{
  constructor(o){ this.o = Object.assign({maxChars:110, minChars:4}, o || {}); this.reset(); }
  reset(){ this.full = ''; this.cut = 0; this.tail = ''; }
  pending(){ return this.full.slice(this.cut); }
  update(full){
    // Re-align if the recognizer revised text before the cut point.
    if(this.cut > 0 && full.slice(0, this.cut) !== this.full.slice(0, this.cut)){
      let pos = -1;
      if(this.tail){
        const from = Math.max(0, this.cut - 40);
        pos = full.indexOf(this.tail, from);
        if(pos < 0) pos = full.lastIndexOf(this.tail);
      }
      if(pos >= 0) this.cut = pos + this.tail.length;
      else if(full.length < this.cut * 0.6) this.cut = 0;      // recognizer started over
      else this.cut = Math.min(this.cut, full.length);
      // Never start the next sentence in the middle of a word.
      if(pos < 0) while(this.cut > 0 && this.cut < full.length && /[A-Za-zÀ-ɏЀ-ӿ0-9']/.test(full[this.cut - 1]) && /[A-Za-zÀ-ɏЀ-ӿ0-9']/.test(full[this.cut])) this.cut++;
    }
    this.full = full;
    const out = [];
    let p = this.pending();
    // Commit up to the last sentence-ending punctuation.
    const re = /[。！？!?；;]|\.(?=\s|$)/g; let m, last = -1;
    while((m = re.exec(p))) last = m.index + 1;
    if(last >= this.o.minChars){ const s = this._commit(last); if(s) out.push(s); p = this.pending(); }
    // Very long run-on speech: cut at a space or comma.
    while(p.length > this.o.maxChars){
      const lim = this.o.maxChars;
      let at = Math.max(p.lastIndexOf(' ', lim), p.lastIndexOf('，', lim), p.lastIndexOf(',', lim), p.lastIndexOf('、', lim));
      if(at < lim * 0.5) at = lim; else at += 1;
      const s = this._commit(at); if(s) out.push(s); p = this.pending();
    }
    return out;
  }
  flush(){ const p = this.pending(); return p.trim() ? this._commit(p.length) : null; }
  _commit(n){
    const seg = this.full.slice(this.cut, this.cut + n).trim();
    this.cut += n;
    this.tail = this.full.slice(Math.max(0, this.cut - 14), this.cut);
    return seg || null;
  }
}
//@@SEGMENTER_END

/* =========================================================
   LiveRecognizer — one continuous session, segmented in code.
   Restarts only when the browser ends the session itself.
   ========================================================= */
class LiveRecognizer{
  constructor(o){ Object.assign(this, {pauseMs:900, onPartial(){}, onSegment(){}, onState(){}, onError(){}}, o); this.want = false; this.seg = new Segmenter(); this.fails = 0; }
  start(){ if(!SR){ this.onError('unsupported'); return; } this.want = true; this.fails = 0; this._spawn(); }
  stop(){ this.want = false; clearTimeout(this.pauseT); try{ this.r && this.r.stop(); }catch(e){} }
  _emit(list){ list.forEach(s => s && this.onSegment(s)); }
  _spawn(){
    const r = new SR(); this.r = r;
    r.lang = this.lang; r.continuous = true; r.interimResults = true; r.maxAlternatives = 1;
    this.seg.reset();
    let gotAny = false;
    r.onstart = () => { this.onState('on'); diag.rec = 'start ' + hhmm(Date.now()); };
    r.onresult = e => {
      gotAny = true; this.fails = 0;
      let full = '', allFinal = true;
      for(let i = 0; i < e.results.length; i++){ full += e.results[i][0].transcript; if(!e.results[i].isFinal) allFinal = false; }
      this._emit(this.seg.update(full));
      if(allFinal) this._emit([this.seg.flush()]);
      this.onPartial(this.seg.pending().trim());
      clearTimeout(this.pauseT);
      if(this.seg.pending().trim()) this.pauseT = setTimeout(() => { this._emit([this.seg.flush()]); this.onPartial(''); }, this.pauseMs);
    };
    r.onerror = e => {
      diag.rec = 'error ' + e.error + ' ' + hhmm(Date.now());
      if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){ this.want = false; this.onError(e.error); }
      else if(e.error !== 'no-speech' && e.error !== 'aborted') this.onError(e.error);
    };
    r.onend = () => {
      clearTimeout(this.pauseT);
      this._emit([this.seg.flush()]); this.onPartial('');
      diag.rec = 'end ' + hhmm(Date.now());
      if(!this.want){ this.onState('off'); return; }
      if(!gotAny) this.fails++;
      if(this.fails >= 4){ this.want = false; this.onState('stalled'); return; }
      this.onState('restart');
      setTimeout(() => { if(!this.want) return; try{ this._spawn(); }catch(err){ this.want = false; this.onState('stalled'); } }, 120);
    };
    try{ r.start(); }
    catch(err){ this.want = false; this.onError('start-failed'); this.onState('off'); }
  }
}

/* One utterance (dialog mode). */
function listenOnce(lang, {onPartial, onDone, onError, onState}){
  if(!SR){ onError('unsupported'); return null; }
  const r = new SR(); r.lang = lang; r.continuous = false; r.interimResults = true;
  let finalText = '', interim = '';
  r.onresult = e => {
    interim = ''; finalText = '';
    for(let i = 0; i < e.results.length; i++){ const t = e.results[i][0].transcript; if(e.results[i].isFinal) finalText += t; else interim += t; }
    onPartial((finalText + interim).trim());
  };
  r.onerror = e => { if(e.error !== 'no-speech' && e.error !== 'aborted') onError(e.error); };
  r.onend = () => { onState(false); const t = (finalText || interim).trim(); if(t) onDone(t); };
  try{ r.start(); onState(true); }catch(e){ onError('start-failed'); onState(false); }
  return r;
}

  'service-not-allowed':'语音识别不可用。请到 设置 → 通用 → 键盘 打开"启用听写"。',
  'network':'语音识别需要联网，网络不稳定。',
  'audio-capture':'没有检测到麦克风。',
  'unsupported':'这个浏览器不支持语音识别，请用 Safari（iPhone）或 Chrome（电脑）。',
  'start-failed':'无法启动语音识别，请再点一次麦克风。',

};

/* =========================================================
   Translation engines
   ========================================================= */
const ENGINE_NAME = {browser:'浏览器本地', microsoft:'微软', mymemory:'MyMemory', llm:'大模型'};
const broken = {}; // engine -> timestamp until which auto mode skips it

// Chrome desktop built-in translator
const btCache = new Map();
async function browserTranslate(text, from, to){
  if(!('Translator' in self)) throw new Error('不支持');
  const key = from.bt + '>' + to.bt;
  let t = btCache.get(key);
  if(!t){
    const avail = await Translator.availability({sourceLanguage:from.bt, targetLanguage:to.bt});
    if(avail === 'unavailable') throw new Error('本地翻译不支持这个语言组合');
    t = await Translator.create({sourceLanguage:from.bt, targetLanguage:to.bt});
    btCache.set(key, t);
  }
  return await t.translate(text);
}

// Microsoft (the free endpoint used by the Edge browser)
let msTok = null, msExp = 0, msTokP = null;
async function msToken(force){
  if(!force && msTok && Date.now() < msExp) return msTok;
  if(!msTokP){
    msTokP = (async () => {
      const r = await fetch('https://edge.microsoft.com/translate/auth');
      if(!r.ok) throw new Error('微软授权失败 ' + r.status);
      msTok = (await r.text()).trim(); msExp = Date.now() + 8 * 60 * 1000; return msTok;
    })().finally(() => { msTokP = null; });
  }
  return msTokP;
}
async function msTranslate(text, from, to){
  const call = async tok => fetch('https://api-edge.cognitive.microsofttranslator.com/translate?api-version=3.0&from=' + from.ms + '&to=' + to.ms, {
    method:'POST', headers:{'Authorization':'Bearer ' + tok, 'Content-Type':'application/json'}, body:JSON.stringify([{Text:text}])
  });
  let r = await call(await msToken());
  if(r.status === 401) r = await call(await msToken(true));
  if(!r.ok) throw new Error('微软翻译返回 ' + r.status);
  const j = await r.json();
  const out = j && j[0] && j[0].translations && j[0].translations[0] && j[0].translations[0].text;
  if(!out) throw new Error('微软翻译没有返回结果');
  return out;
}

// MyMemory
async function myMemory(text, from, to){
  const url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text.slice(0,480)) + '&langpair=' + from.mm + '|' + to.mm;
  const res = await fetch(url);
  if(!res.ok) throw new Error('MyMemory 返回 ' + res.status);
  const j = await res.json();
  const out = j && j.responseData && j.responseData.translatedText;
  if(j.responseStatus == 429 || /MYMEMORY WARNING/i.test(out || '')) throw new Error('MyMemory 今日额度用完了');
  if(!out) throw new Error('MyMemory 没有返回结果');
  const ta = document.createElement('textarea'); ta.innerHTML = out; return ta.value;
}

// OpenAI-compatible LLM, streamed
async function llmStream(messages, onDelta, temperature){
  if(!settings.base || !settings.key || !settings.model) throw new Error('请先在设置里填写大模型接口地址、模型名和 Key');
  const url = settings.base.replace(/\/+$/,'') + '/chat/completions';
  let res;
  try{
    res = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer ' + settings.key},
      body: JSON.stringify({model:settings.model, messages, temperature: temperature ?? 0.2, stream:true})});
  }catch(e){ throw new Error('网络错误：接口地址不对，或该服务商不允许网页直接调用'); }
  if(!res.ok){ let m = ''; try{ m = (await res.json()).error.message; }catch(_){} throw new Error('接口返回 ' + res.status + (m ? '：' + m : '')); }
  if(!res.body || !res.body.getReader){
    const raw = await res.text(); let text = '';
    raw.split('\n').forEach(line => { line = line.trim(); if(!line.startsWith('data:')) return; const d = line.slice(5).trim(); if(d === '[DONE]') return; try{ const c = JSON.parse(d).choices[0].delta.content; if(c) text += c; }catch(_){} });
    if(!text){ try{ text = JSON.parse(raw).choices[0].message.content; }catch(_){} }
    onDelta && onDelta(text); return text.trim();
  }
  const reader = res.body.getReader(), dec = new TextDecoder(); let buf = '', text = '';
  for(;;){
    const {done, value} = await reader.read(); if(done) break;
    buf += dec.decode(value, {stream:true});
    let i;
    while((i = buf.indexOf('\n')) >= 0){
      const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
      if(!line.startsWith('data:')) continue;
      const d = line.slice(5).trim(); if(d === '[DONE]') continue;
      try{ const j = JSON.parse(d); const c = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content; if(c){ text += c; onDelta && onDelta(text); } }catch(_){}
    }
  }
  return text.trim();
}
function llmTranslate(text, from, to, context, onDelta){
  const sys = '你是专业同声传译。把用户发来的' + from.name + '口语转写翻译成自然流畅的' + to.name + '。转写可能有识别错误，按上下文合理理解。只输出译文，不要解释，不要加引号。'
    + (context ? '\n前文（仅供参考，不要翻译）：\n' + context : '');
  return llmStream([{role:'system', content:sys},{role:'user', content:text}], onDelta, 0.2);
}

function engineOrder(){
  if(settings.engine !== 'auto') return [settings.engine];
  const now = Date.now(), order = [];
  if('Translator' in self) order.push('browser');
  order.push('microsoft', 'mymemory');
  return order.filter(e => !(broken[e] > now)).concat(order.filter(e => broken[e] > now));
}
// Which engine a preview would use; previews skip the quota-limited one.
function previewAllowed(){ const e = engineOrder()[0]; return settings.preview && e !== 'mymemory'; }

async function translate(text, fromId, toId, opts){
  opts = opts || {};
  const from = L(fromId), to = L(toId);
  if(from.id === to.id) return text;
  const order = engineOrder(); let lastErr;
  for(const eng of order){
    const t0 = performance.now();
    try{
      let out;
      if(eng === 'llm') out = await llmTranslate(text, from, to, opts.context, opts.onDelta);
      else if(eng === 'browser') out = await browserTranslate(text, from, to);
      else if(eng === 'microsoft') out = await msTranslate(text, from, to);
      else out = await myMemory(text, from, to);
      if(!opts.quiet){ diag.engine = ENGINE_NAME[eng]; diag.ms = Math.round(performance.now() - t0); diag.count++; diagRender(); }
      return out;
    }catch(e){
      lastErr = e;
      if(settings.engine === 'auto'){ broken[eng] = Date.now() + 5 * 60 * 1000; }
      if(!opts.quiet){ diag.err = ENGINE_NAME[eng] + '：' + e.message; diagRender(); }
    }
  }
  throw lastErr || new Error('翻译失败');
}

/* ---------- sessions / history ---------- */
let sessions = store.get('sessions', []);
const saveSessions = () => { if(sessions.length > 60) sessions = sessions.slice(0,60); store.set('sessions', sessions); };
function upsertSession(s){
  if(!s.lines.length) return;
  const i = sessions.findIndex(x => x.id === s.id);
  if(i >= 0) sessions[i] = s; else sessions.unshift(s);
  saveSessions();
}
const cleanSession = s => Object.assign({}, s, {lines: s.lines.map(l => ({t:l.t, orig:l.orig, tr:l.tr, err:l.err, side:l.side}))});
let saveT; const saveSoon = s => { clearTimeout(saveT); saveT = setTimeout(()=>upsertSession(cleanSession(s)), 700); };
function sessionText(s){
  return s.lines.map(l => '[' + hhmm(l.t) + '] ' + (s.mode === 'duo' ? (l.side === 'me' ? '我：' : '对方：') : '') + l.orig + '\n' + (l.tr || '')).join('\n\n');
}

/* ---------- wake lock ---------- */
let wakeLock = null;
async function keepAwake(on){
  try{
    if(on && settings.wake && 'wakeLock' in navigator && !wakeLock){ wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', ()=>wakeLock=null); }
    if(!on && wakeLock){ await wakeLock.release(); wakeLock = null; }
  }catch(e){}
}
function fillSelect(sel, value){
  sel.innerHTML = '';
  LANGS.forEach(l => { const o = document.createElement('option'); o.value = l.id; o.textContent = l.name; sel.appendChild(o); });
  sel.value = value;
}

/* =========================================================
   同传 (live interpretation)
   ========================================================= */
const liveStream = $('#live-stream'), liveMic = $('#live-mic'), liveStatus = $('#live-status'), jumpBtn = $('#live-jump');
const liveFrom = $('#live-from'), liveTo = $('#live-to'), clockEl = $('#live-clock');
fillSelect(liveFrom, settings.liveFrom); fillSelect(liveTo, settings.liveTo);
let live = newLiveSession(), rec = null, running = false, paused = false;
let liveEl = null, previewSeq = 0, previewT = null, stick = true;
let elapsed = 0, startedAt = 0, clockT = null;

function newLiveSession(){ return {id:'s' + Date.now(), mode:'live', t:Date.now(), from:settings.liveFrom, to:settings.liveTo, lines:[]}; }
function renderLiveEmpty(){
  if(live.lines.length || liveEl) return;
  liveStream.innerHTML = '<div class="empty"><b>' + L(settings.liveFrom).name + ' → ' + L(settings.liveTo).name + '</b><span>点下面的麦克风，把手机对着说话的人。原文和译文会逐句出现在这里。</span></div>';
}
function segEl(){
  const d = document.createElement('div'); d.className = 'seg';
  d.innerHTML = '<div class="meta"><span class="state"></span><time></time></div><div class="orig"></div><div class="tr"></div>';
  return d;
}
function paintLine(line){
  const d = line._el; if(!d) return;
  const st = d.querySelector('.state'), tr = d.querySelector('.tr');
  d.querySelector('time').textContent = hhmm(line.t);
  d.querySelector('.orig').textContent = line.orig;
  if(line.err){ st.className = 'state fail'; st.textContent = '失败'; tr.className = 'tr err'; tr.textContent = '翻译失败：' + line.err; }
  else if(line.done){ st.className = 'state'; st.textContent = '已完成'; tr.className = 'tr'; tr.textContent = line.tr; }
  else { st.className = 'state busy'; st.textContent = '翻译中'; tr.className = line.tr ? 'tr' : 'tr wait'; tr.textContent = line.tr || '…'; }
}
function scrollLive(){ if(stick) liveStream.scrollTop = liveStream.scrollHeight; }
liveStream.addEventListener('scroll', ()=>{
  stick = liveStream.scrollHeight - liveStream.scrollTop - liveStream.clientHeight < 60;
  jumpBtn.hidden = stick;
});
jumpBtn.onclick = ()=>{ stick = true; scrollLive(); jumpBtn.hidden = true; };

// The dashed card at the bottom that shows what is being heard right now.
function showPartial(text){
  if(!text){ if(liveEl){ liveEl.remove(); liveEl = null; } previewSeq++; clearTimeout(previewT); return; }
  if(!liveEl){
    liveStream.querySelector('.empty')?.remove();
    liveEl = segEl(); liveEl.classList.add('live');
    const st = liveEl.querySelector('.state'); st.className = 'state listen'; st.textContent = '正在听';
    liveStream.appendChild(liveEl);
  }
  liveEl.querySelector('.orig').textContent = text;
  liveStream.appendChild(liveEl); scrollLive();
  if(previewAllowed() && text.length >= 6){
    clearTimeout(previewT);
    const seq = ++previewSeq;
    previewT = setTimeout(async ()=>{
      try{
        const out = await translate(text, live.from, live.to, {quiet:true});
        if(seq === previewSeq && liveEl){ liveEl.querySelector('.tr').textContent = out; scrollLive(); }
      }catch(e){}
    }, 450);
  }
}
async function addSegment(text){
  liveStream.querySelector('.empty')?.remove();
  const line = {t:Date.now(), orig:text, tr:'', done:false};
  live.lines.push(line);
  line._el = segEl(); paintLine(line);
  if(liveEl) liveStream.insertBefore(line._el, liveEl); else liveStream.appendChild(line._el);
  scrollLive();
  const ctx = live.lines.slice(-4, -1).map(l => l.orig).join('\n');
  try{
    line.tr = await translate(text, live.from, live.to, {context:ctx, onDelta: t => { line.tr = t; paintLine(line); scrollLive(); }});
    line.done = true;
  }catch(e){ line.err = e.message; }
  paintLine(line); scrollLive(); saveSoon(live);
}

function tickClock(){ clockEl.textContent = mmss(elapsed + (paused ? 0 : Date.now() - startedAt)); }
function setUI(state){ // idle | running | paused
  const on = state !== 'idle';
  $('#live-new').hidden = on; $('#live-copy').hidden = on;
  $('#live-pause').hidden = !on; clockEl.hidden = !on;
  $('#live-pause').textContent = state === 'paused' ? '继续' : '暂停';
  clockEl.classList.toggle('paused', state === 'paused');
  liveMic.classList.toggle('stop', on);
  $('#ico-mic').toggleAttribute('hidden', on); $('#ico-stop').toggleAttribute('hidden', !on);
  liveMic.setAttribute('aria-label', on ? '结束并保存' : '开始同传');
}
function makeRecognizer(){
  return new LiveRecognizer({
    lang: L(live.from).sr, pauseMs: +settings.pauseMs,
    onPartial: showPartial,
    onSegment: addSegment,
    onState: s => {
      diagRender();
      if(s === 'on') liveStatus.textContent = '正在听 ' + L(live.from).name + ' · 译成 ' + L(live.to).name;
      if(s === 'stalled'){ paused = true; elapsed += Date.now() - startedAt; setUI('paused'); liveStatus.textContent = '识别中断了，点"继续"接着听'; }
    },
    onError: c => { toast(errText(c)); liveStatus.textContent = errText(c); if(c === 'not-allowed' || c === 'service-not-allowed' || c === 'unsupported') stopLive(); }
  });
}
function startLive(){
  if(live.lines.length && (live.from !== settings.liveFrom || live.to !== settings.liveTo)){ upsertSession(cleanSession(live)); live = newLiveSession(); liveStream.innerHTML = ''; }
  live.from = settings.liveFrom; live.to = settings.liveTo;
  running = true; paused = false; elapsed = 0; startedAt = Date.now();
  clearInterval(clockT); clockT = setInterval(tickClock, 500); tickClock();
  setUI('running'); keepAwake(true);
  rec = makeRecognizer(); rec.start();
}
function pauseLive(){
  if(!running) return;
  if(paused){
    paused = false; startedAt = Date.now(); setUI('running');
    rec = makeRecognizer(); rec.start();
  }else{
    paused = true; elapsed += Date.now() - startedAt; setUI('paused');
    rec && rec.stop(); liveStatus.textContent = '已暂停';
  }
}
function stopLive(){
  if(rec) rec.stop();
  running = false; paused = false; clearInterval(clockT);
  setUI('idle'); keepAwake(false);
  upsertSession(cleanSession(live));
  liveStatus.textContent = live.lines.length ? '已结束，共 ' + live.lines.length + ' 句，记录已保存' : '点麦克风开始';
}
liveMic.onclick = ()=>{ running ? stopLive() : startLive(); };
$('#live-pause').onclick = pauseLive;
$('#live-new').onclick = ()=>{
  upsertSession(cleanSession(live)); live = newLiveSession(); liveStream.innerHTML = ''; liveEl = null; renderLiveEmpty();
  liveStatus.textContent = '新会话，点麦克风开始';
};
$('#live-copy').onclick = ()=>{ if(!live.lines.length) return toast('还没有内容'); copyText(sessionText(live)); };
function onPairChange(){
  settings.liveFrom = liveFrom.value; settings.liveTo = liveTo.value; saveSettings();
  if(running){ stopLive(); toast('语言已切换，请重新开始'); }
  renderLiveEmpty();
}
liveFrom.onchange = onPairChange; liveTo.onchange = onPairChange;
$('#live-swap').onclick = ()=>{ const a = liveFrom.value; liveFrom.value = liveTo.value; liveTo.value = a; onPairChange(); };

/* =========================================================
   对话 (face-to-face)
   ========================================================= */
const duoMeSel = $('#duo-me'), duoOtherSel = $('#duo-other');
fillSelect(duoMeSel, settings.duoMe); fillSelect(duoOtherSel, settings.duoOther);
const themStream = $('#duo-them'), meStream = $('#duo-me-stream');
let duo = newDuoSession(), duoRec = null, duoSide = null;

function newDuoSession(){ return {id:'d' + Date.now(), mode:'duo', t:Date.now(), from:settings.duoMe, to:settings.duoOther, lines:[]}; }
function updateDuoLabels(){
  const me = L(settings.duoMe), other = L(settings.duoOther);
  $('#me-label').textContent = me.native; $('#them-label').textContent = other.native; $('#them-hint').textContent = other.hint;
}
function bubble(main, cls, sub){
  const b = document.createElement('div'); b.className = 'bubble ' + cls; b.textContent = main;
  if(sub){ const s = document.createElement('small'); s.textContent = sub; b.appendChild(s); }
  return b;
}
function renderDuo(){
  themStream.innerHTML = ''; meStream.innerHTML = '';
  if(!duo.lines.length){
    meStream.innerHTML = '<div class="empty"><b>面对面对话</b><span>把手机平放在两人中间，上半屏给对方看。双方各按自己的麦克风说话。</span></div>';
    themStream.innerHTML = '<div class="empty"><span>' + L(settings.duoOther).hint + '</span></div>';
    return;
  }
  duo.lines.forEach(l => {
    const mine = l.side === 'me', tr = l.err ? '翻译失败' : (l.tr || '…');
    meStream.appendChild(bubble(mine ? l.orig : tr, mine ? 'mine' : 'other', mine ? l.tr : l.orig));
    themStream.appendChild(bubble(mine ? tr : l.orig, mine ? 'other' : 'mine', mine ? l.orig : l.tr));
  });
  meStream.scrollTop = meStream.scrollHeight; themStream.scrollTop = themStream.scrollHeight;
}
function speak(text, langId){
  if(!settings.tts || !('speechSynthesis' in window) || !text) return;
  try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = L(langId).sr; speechSynthesis.speak(u); }catch(e){}
}
function startDuo(side){
  if(duoRec){ try{ duoRec.stop(); }catch(e){} if(duoSide === side) return; }
  try{ speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance('')); }catch(e){}
  const fromId = side === 'me' ? settings.duoMe : settings.duoOther;
  const toId = side === 'me' ? settings.duoOther : settings.duoMe;
  const btn = side === 'me' ? $('#me-mic') : $('#them-mic');
  const lbl = side === 'me' ? $('#me-label') : $('#them-label');
  duoSide = side;
  duoRec = listenOnce(L(fromId).sr, {
    onPartial: t => { lbl.textContent = t || L(fromId).native; },
    onDone: async text => {
      const line = {t:Date.now(), side, orig:text, tr:''};
      duo.lines.push(line); renderDuo();
      const ctx = duo.lines.slice(-4,-1).map(l => l.orig).join('\n');
      try{ line.tr = await translate(text, fromId, toId, {context:ctx, onDelta: t => { line.tr = t; renderDuo(); }}); speak(line.tr, toId); }
      catch(e){ line.err = e.message; toast('翻译失败：' + e.message); }
      renderDuo(); saveSoon(duo);
    },
    onState: on => { btn.classList.toggle('on', on); if(!on){ duoRec = null; duoSide = null; updateDuoLabels(); } },
    onError: c => toast(errText(c))
  });
}
$('#me-mic').onclick = ()=>startDuo('me');
$('#them-mic').onclick = ()=>startDuo('them');
function onDuoLang(){
  settings.duoMe = duoMeSel.value; settings.duoOther = duoOtherSel.value; saveSettings();
  upsertSession(cleanSession(duo)); duo = newDuoSession(); updateDuoLabels(); renderDuo();
}
duoMeSel.onchange = onDuoLang; duoOtherSel.onchange = onDuoLang;
$('#duo-clear').onclick = ()=>{ upsertSession(cleanSession(duo)); duo = newDuoSession(); renderDuo(); toast('对话已保存到记录'); };

/* =========================================================
   记录 (history)
   ========================================================= */
const histBody = $('#hist-body'), histBack = $('#hist-back'), histTitle = $('#hist-title');
function renderHistList(){
  histTitle.textContent = '记录'; histBack.hidden = true; histBody.innerHTML = '';
  if(!sessions.length){ histBody.innerHTML = '<div class="empty" style="margin-top:20vh"><b>还没有记录</b><span>同传和对话结束后会自动保存在这台手机上。</span></div>'; return; }
  sessions.forEach(s => {
    const b = document.createElement('button'); b.className = 'hitem';
    const t = document.createElement('div'); t.className = 't';
    const title = document.createElement('b'); title.textContent = (s.lines[0] && (s.lines[0].tr || s.lines[0].orig)) || '空记录';
    const sub = document.createElement('span'); sub.textContent = dateStr(s.t) + ' · ' + L(s.from).name + ' ⇄ ' + L(s.to).name + ' · ' + s.lines.length + ' 句';
    t.append(title, sub);
    const chip = document.createElement('span'); chip.className = 'chip'; chip.textContent = s.mode === 'duo' ? '对话' : '同传';
    b.append(t, chip); b.onclick = ()=>renderHistDetail(s.id);
    histBody.appendChild(b);
  });
}
function renderHistDetail(id){
  const s = sessions.find(x => x.id === id); if(!s) return renderHistList();
  histTitle.textContent = dateStr(s.t); histBack.hidden = false; histBody.innerHTML = '';
  const actions = document.createElement('div'); actions.className = 'row';
  const mk = (txt, cls, fn) => { const b = document.createElement('button'); b.className = 'btn ' + cls; b.textContent = txt; b.onclick = fn; actions.appendChild(b); return b; };
  mk('复制', 'sec', ()=>copyText(sessionText(s)));
  mk('导出 txt', 'sec', ()=>downloadTxt('随口译-' + new Date(s.t).toISOString().slice(0,16).replace(/[:T]/g,'-') + '.txt', sessionText(s)));
  const sumBtn = mk(s.summary ? '重新总结' : 'AI 总结', '', ()=>summarize(s, sumBox, sumBtn));
  const del = mk('删除', 'danger', ()=>{
    if(del.dataset.armed){ sessions = sessions.filter(x => x.id !== s.id); saveSessions(); renderHistList(); toast('已删除'); }
    else { del.dataset.armed = '1'; del.textContent = '再点一次确认删除'; setTimeout(()=>{ delete del.dataset.armed; del.textContent = '删除'; }, 3000); }
  });
  histBody.appendChild(actions);
  const sumBox = document.createElement('div'); sumBox.className = 'card'; sumBox.hidden = !s.summary;
  if(s.summary){ sumBox.innerHTML = '<h2>AI 总结</h2><div class="summary"></div>'; sumBox.querySelector('.summary').textContent = s.summary; }
  histBody.appendChild(sumBox);
  s.lines.forEach(l => {
    const d = segEl();
    d.querySelector('.state').textContent = s.mode === 'duo' ? (l.side === 'me' ? '我' : '对方') : (l.tr ? '已完成' : '失败');
    if(!l.tr) d.querySelector('.state').className = 'state fail';
    d.querySelector('time').textContent = hhmm(l.t);
    d.querySelector('.orig').textContent = l.orig;
    const t = d.querySelector('.tr'); t.className = l.tr ? 'tr' : 'tr err'; t.textContent = l.tr || ('翻译失败' + (l.err ? '：' + l.err : ''));
    histBody.appendChild(d);
  });
}
async function summarize(s, box, btn){
  if(!(settings.base && settings.key && settings.model)){ toast('AI 总结需要先在设置里配置大模型 API'); return; }
  btn.disabled = true; btn.textContent = '总结中…';
  box.hidden = false; box.innerHTML = '<h2>AI 总结</h2><div class="summary">正在生成…</div>';
  const out = box.querySelector('.summary');
  const lang = L(s.mode === 'duo' ? s.from : s.to).name;
  const transcript = s.lines.map(l => (s.mode === 'duo' ? (l.side === 'me' ? '我：' : '对方：') : '') + l.orig + (l.tr ? '（译：' + l.tr + '）' : '')).join('\n').slice(-12000);
  try{
    const text = await llmStream([
      {role:'system', content:'你是会议记录助手。根据语音转写整理一份' + lang + '总结，包含：一句话概要、要点（3-8 条）、待办或需要跟进的事项（没有就写"无"）。转写可能有识别错误，按上下文理解。用纯文本，不要用 Markdown 符号。'},
      {role:'user', content:transcript}
    ], t => { out.textContent = t; }, 0.3);
    s.summary = text; saveSessions(); out.textContent = text; btn.textContent = '重新总结';
  }catch(e){ out.textContent = '总结失败：' + e.message; btn.textContent = 'AI 总结'; }
  btn.disabled = false;
}
histBack.onclick = renderHistList;

/* =========================================================
   设置 (settings)
   ========================================================= */
const PRESETS = {
  deepseek:{base:'https://api.deepseek.com', model:'deepseek-chat'},
  qwen:{base:'https://dashscope.aliyuncs.com/compatible-mode/v1', model:'qwen-plus'},
  openai:{base:'https://api.openai.com/v1', model:'gpt-4o-mini'}
};
const sEngine = $('#s-engine'), sBase = $('#s-base'), sModel = $('#s-model'), sKey = $('#s-key');
function loadSettingsUI(){
  sEngine.value = settings.engine; sBase.value = settings.base; sModel.value = settings.model; sKey.value = settings.key;
  $('#s-orig').checked = settings.showOrig; $('#s-tts').checked = settings.tts; $('#s-wake').checked = settings.wake;
  $('#s-size').value = settings.size; $('#s-preview').checked = settings.preview; $('#s-pause').value = String(settings.pauseMs);
  applyDisplay();
}
function applyDisplay(){
  document.documentElement.style.setProperty('--sub', settings.size + 'px');
  liveStream.classList.toggle('hide-orig', !settings.showOrig);
}
sEngine.onchange = ()=>{ settings.engine = sEngine.value; saveSettings(); };
sBase.oninput = ()=>{ settings.base = sBase.value.trim(); saveSettings(); };
sModel.oninput = ()=>{ settings.model = sModel.value.trim(); saveSettings(); };
sKey.oninput = ()=>{ settings.key = sKey.value.trim(); saveSettings(); };
document.querySelectorAll('[data-preset]').forEach(b => b.onclick = ()=>{
  const p = PRESETS[b.dataset.preset]; settings.base = p.base; settings.model = p.model; settings.engine = 'llm'; saveSettings(); loadSettingsUI(); toast('已填入，再填 API Key');
});
$('#s-orig').onchange = e => { settings.showOrig = e.target.checked; saveSettings(); applyDisplay(); };
$('#s-tts').onchange = e => { settings.tts = e.target.checked; saveSettings(); };
$('#s-wake').onchange = e => { settings.wake = e.target.checked; saveSettings(); };
$('#s-preview').onchange = e => { settings.preview = e.target.checked; saveSettings(); };
$('#s-pause').onchange = e => { settings.pauseMs = +e.target.value; saveSettings(); };
$('#s-size').oninput = e => { settings.size = +e.target.value; saveSettings(); applyDisplay(); };
$('#s-test').onclick = async ()=>{
  const out = $('#s-test-out'); out.textContent = '测试中…';
  const t0 = performance.now();
  try{ const r = await translate('Hello, could you tell me where the library is?', 'en', 'zh'); out.textContent = '✓ ' + diag.engine + ' ' + Math.round(performance.now() - t0) + 'ms：' + r; }
  catch(e){ out.textContent = '✗ ' + e.message; }
};

/* ---------- tabs ---------- */
const views = {live:$('#v-live'), duo:$('#v-duo'), hist:$('#v-hist'), set:$('#v-set')};
document.querySelectorAll('.tabs button').forEach(b => b.onclick = ()=>{
  const v = b.dataset.view;
  document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-selected', x === b ? 'true' : 'false'));
  Object.entries(views).forEach(([k, el]) => el.hidden = k !== v);
  if(v !== 'live' && running) stopLive();
  if(v !== 'duo' && duoRec){ try{ duoRec.stop(); }catch(e){} }
  if(v === 'hist') renderHistList();
  if(v === 'set') diagRender();
});
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'visible' && running && !paused) keepAwake(true); });

/* ---------- boot ---------- */
loadSettingsUI(); renderLiveEmpty(); updateDuoLabels(); renderDuo(); diagRender();
</script>
</body>
</html>
